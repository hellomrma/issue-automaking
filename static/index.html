<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>티스토리 글 자동 생성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <h1>티스토리 글 자동 생성</h1>
      <p>요즘 사람들이 찾는 주제로 블로그 원고를 씁니다.</p>
    </header>

    <main class="desk">
      <section class="workbench" aria-label="글 설정">
        <div class="block">
          <div class="block-head">
            <h2>오늘의 검색어</h2>
            <div class="block-actions">
              <button type="button" id="multiPick" class="btn btn-quiet hidden" aria-pressed="false">여러 개 고르기</button>
              <button type="button" id="fetchTrends" class="btn btn-quiet">불러오기</button>
            </div>
          </div>
          <div id="trendsStatus" class="status" aria-live="polite"></div>
          <div id="trendsContainer" class="trends"></div>
          <div id="trendNews" class="trend-news hidden" aria-live="polite"></div>
          <div id="batchBar" class="batch-bar hidden">
            <span id="batchCount">0개 고름</span>
            <button type="button" id="batchStart" class="btn btn-primary" disabled>연달아 생성</button>
            <button type="button" id="batchStop" class="btn btn-quiet hidden">멈추기</button>
          </div>
          <ol id="batchList" class="batch-list hidden" aria-live="polite"></ol>
        </div>

        <div class="block">
          <h2>무엇에 대해 쓸까요</h2>
          <div class="segmented" role="tablist" aria-label="입력 방식">
            <button type="button" id="modeKeyword" class="mode-tab active" role="tab">키워드</button>
            <button type="button" id="modeUrl" class="mode-tab" role="tab">기사 URL</button>
          </div>

          <div id="keywordInputSection">
            <label class="field">
              <span class="field-label">키워드</span>
              <input type="text" id="keyword" placeholder="검색어를 고르거나 직접 입력하세요" autocomplete="off" />
            </label>
            <div id="dupNotice" class="dup-notice hidden" aria-live="polite"></div>
            <label class="field">
              <span class="field-label">참고할 글 <span class="optional">선택</span></span>
              <input type="url" id="referenceUrl" placeholder="https://" autocomplete="off" />
            </label>
          </div>
          <div id="urlInputSection" class="hidden">
            <label class="field">
              <span class="field-label">기사 URL</span>
              <input type="url" id="sourceUrl" placeholder="https://" autocomplete="off" />
              <span class="field-hint">이 페이지의 내용을 새 관점으로 다시 씁니다.</span>
            </label>
          </div>
        </div>

        <div class="block">
          <h2>어떤 글로</h2>
          <fieldset class="styles">
            <legend class="sr-only">글 스타일</legend>
            <label class="style-option">
              <input type="radio" name="style" value="정보성" checked />
              <span class="style-name">정보성</span>
              <span class="style-desc">알아두면 좋은 내용을 정리</span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="리뷰" />
              <span class="style-name">리뷰</span>
              <span class="style-desc">써 본 경험과 솔직한 평가</span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="How-to" />
              <span class="style-name">How-to</span>
              <span class="style-desc">순서대로 따라 하는 방법</span>
            </label>
            <label class="style-option">
              <input type="radio" name="style" value="뉴스해설" />
              <span class="style-name">뉴스해설</span>
              <span class="style-desc">이슈 요약과 내 생각</span>
            </label>
          </fieldset>

          <fieldset class="segmented lengths">
            <legend class="field-label">분량</legend>
            <label><input type="radio" name="length" value="short" /><span>짧게<small>400~600자</small></span></label>
            <label><input type="radio" name="length" value="medium" /><span>보통<small>800~1,200자</small></span></label>
            <label><input type="radio" name="length" value="long" checked /><span>길게<small>1,500~2,000자</small></span></label>
          </fieldset>

          <label class="field">
            <span class="field-label">작성 요청 <span class="optional">선택</span></span>
            <textarea id="guide" rows="2" placeholder="예: 초보자 눈높이로, 비교 표를 넣어 주세요"></textarea>
          </label>

          <details class="options">
            <summary>세부 설정</summary>
            <div class="checks">
              <label><input type="checkbox" id="useWebSearch" checked /> 최신 뉴스·검색 결과 반영</label>
              <label class="check-sub"><input type="checkbox" id="useClaudeSearch" /> Claude가 직접 웹 검색 <span class="optional" id="claudeSearchHint">더 정확하지만 검색 1,000회당 약 $10 추가</span></label>
              <label><input type="checkbox" id="includeSources" checked /> 글 끝에 참고한 자료 링크 넣기</label>
              <label><input type="checkbox" id="useEmoji" checked /> 이모지 넣기</label>
            </div>
            <label class="field" id="claudeKeyField">
              <span class="field-label">Claude API 키 <span class="optional key-hint">비워 두면 서버 설정 사용</span></span>
              <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
            </label>
            <label class="field hidden" id="openaiKeyField">
              <span class="field-label">OpenAI API 키 <span class="optional key-hint">비워 두면 서버 설정 사용</span></span>
              <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" />
            </label>
            <label class="check-inline"><input type="checkbox" id="saveKey" /> 이 탭을 닫을 때까지 키 기억하기</label>
          </details>
        </div>

        <fieldset class="provider">
          <legend class="field-label">쓰는 AI</legend>
          <div class="segmented">
            <label><input type="radio" name="provider" value="claude" checked /><span>Claude</span></label>
            <label><input type="radio" name="provider" value="openai" /><span>OpenAI</span></label>
          </div>
          <span id="providerModel" class="provider-model"></span>
        </fieldset>

        <div class="generate-bar">
          <button type="button" id="generate" class="btn btn-primary">글 생성</button>
          <button type="button" id="cancelGenerate" class="btn btn-quiet hidden">멈추기</button>
          <kbd class="shortcut">Ctrl + Enter</kbd>
        </div>
        <div id="generateStatus" class="status" aria-live="polite"></div>

        <details class="block history" open>
          <summary><h2>지난 글</h2> <span id="historyCount" class="history-count"></span></summary>
          <input type="search" id="historySearch" placeholder="제목이나 키워드로 찾기" aria-label="지난 글 검색" />
          <ul id="historyList" class="history-list"></ul>
        </details>
      </section>

      <section class="manuscript" aria-label="결과">
        <div class="manuscript-head">
          <div class="view-tabs" role="tablist" aria-label="보기 방식">
            <button type="button" id="tabSource" class="tab-btn active" role="tab">마크다운</button>
            <button type="button" id="tabPreview" class="tab-btn" role="tab">미리보기</button>
          </div>
          <span id="charCount" class="char-count">0자</span>
        </div>

        <div class="sheet">
          <pre id="output" class="output" data-empty="키워드를 고르고 ‘글 생성’을 누르면 여기에 원고가 채워집니다."></pre>
          <div id="preview" class="preview hidden"></div>
        </div>

        <div class="manuscript-actions">
          <button type="button" id="copyHtml" class="btn btn-ink" title="티스토리 에디터에 그대로 붙여넣을 수 있는 형식">티스토리용 복사</button>
          <button type="button" id="copyMd" class="btn btn-quiet">마크다운 복사</button>
          <button type="button" id="genMeta" class="btn btn-quiet">제목·설명 추천</button>
          <button type="button" id="downloadMd" class="btn btn-quiet">서버에 저장</button>
          <span id="actionStatus" class="status inline" aria-live="polite"></span>
        </div>

        <div id="reviseBar" class="revise-bar hidden">
          <div class="revise-row">
            <select id="reviseTarget" aria-label="고칠 범위"></select>
            <input type="text" id="reviseInstruction" placeholder="어떻게 고칠까요? 예: 더 짧고 쉽게" aria-label="고칠 내용" maxlength="500" />
            <button type="button" id="revise" class="btn btn-ink">다듬기</button>
          </div>
          <div class="revise-presets">
            <button type="button" class="chip" data-revise-preset="더 짧고 간결하게 줄여 주세요">더 짧게</button>
            <button type="button" class="chip" data-revise-preset="초보자도 이해하기 쉬운 말로 풀어 주세요">더 쉽게</button>
            <button type="button" class="chip" data-revise-preset="구체적인 예시나 사례를 하나 더 넣어 주세요">예시 추가</button>
            <button type="button" class="chip" data-revise-preset="말투를 더 친근하고 가볍게 바꿔 주세요">더 친근하게</button>
          </div>
          <div id="reviseStatus" class="status" aria-live="polite"></div>
        </div>

        <div id="metaStatus" class="status" aria-live="polite"></div>
        <div id="metaPanel" class="meta-panel hidden"></div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
